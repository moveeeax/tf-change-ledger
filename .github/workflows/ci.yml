name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: build and test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.26", "1.27"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          check-latest: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      - name: test
        run: go test -race -count=1 ./...

      - name: tidy is up to date
        if: matrix.go == '1.27'
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  smoke:
    name: end-to-end smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
          check-latest: true

      - name: build the cli
        run: go build -o tf-change-ledger ./cmd/tf-change-ledger

      # Exercises the flow documented in the README so the example cannot rot.
      - name: gate blocks an unacknowledged destroy
        run: |
          set +e
          ./tf-change-ledger gate \
            -plan testdata/plan-destructive.json \
            -config testdata/.tf-ledger.yml \
            -author alice
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }

      - name: gate passes once acknowledged
        run: |
          ./tf-change-ledger gate \
            -plan testdata/plan-destructive.json \
            -config testdata/.tf-ledger.yml \
            -author alice -ack "bob:/ledger approve"

      - name: record, verify and export
        run: |
          ./tf-change-ledger record \
            -plan testdata/plan-destructive.json \
            -config testdata/.tf-ledger.yml \
            -ledger "$RUNNER_TEMP/ledger.jsonl" \
            -repo acme/platform -pr 128 -commit 4f1c0de9c0ffee \
            -author alice -approver carol -ack "bob:/ledger approve"
          ./tf-change-ledger verify -ledger "$RUNNER_TEMP/ledger.jsonl"
          ./tf-change-ledger export -ledger "$RUNNER_TEMP/ledger.jsonl" -protected-only

      - name: verify detects tampering
        run: |
          sed -i 's/"author":"alice"/"author":"mallory"/' "$RUNNER_TEMP/ledger.jsonl"
          set +e
          ./tf-change-ledger verify -ledger "$RUNNER_TEMP/ledger.jsonl"
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2, got $code"; exit 1; }
